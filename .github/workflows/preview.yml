# Copyable Deploy Preview template. Keep this file valid YAML. Do not comment it out.
# On SolZeroAI/platform, disable it with Actions → Deploy Preview → Disable workflow
# (`gh workflow disable preview.yml`). Disabled state is per-repo; fork owners enable it
# on their Actions page. The invert guard below is the belt if the public workflow is enabled.
# Do not add secrets on SolZeroAI/platform.
name: Deploy Preview

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:
    inputs:
      action:
        description: >-
          deploy-standing-pre refreshes standing Alchemy stage pre.
          destroy-ephemeral removes an orphaned pre-<number> stage.
          Standing pre cannot be destroyed here.
        required: true
        type: choice
        default: deploy-standing-pre
        options:
          - deploy-standing-pre
          - destroy-ephemeral
      stage:
        description: >-
          Required for destroy-ephemeral only. Must start with pre- and cannot
          be exact pre.
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pre-{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy-ephemeral' && (github.event.inputs.stage || 'destroy-ephemeral')) || 'pre' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    if: ${{ github.repository != 'SolZeroAI/platform' && (github.event_name != 'pull_request' || github.event.action != 'closed') && (github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy-standing-pre') }}
    uses: ./.github/workflows/validate.yml
    permissions:
      actions: read
      contents: read
      checks: write
      pull-requests: write

  deploy-preview:
    name: Deploy preview stage
    needs: validate
    if: ${{ github.repository != 'SolZeroAI/platform' && !cancelled() && needs.validate.result == 'success' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy-standing-pre') || (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository))) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: pre
    permissions:
      actions: read
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags let the deploy compute the release offset
          # label, for example v1.5.0+2-bbb222.
          fetch-depth: 0

      - name: Set up Nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.4.11
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Resolve preview target
        id: preview-target
        run: |
          stage=$(node <<'NODE'
          const fs = require("node:fs");
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          process.stdout.write(process.env.GITHUB_EVENT_NAME === "pull_request" ? `pre-${event.pull_request.number}` : "pre");
          NODE
          )
          website_url=$(nub run config:stage-url -- "$stage" | tail -n 1)
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "website_url=$website_url" >> "$GITHUB_OUTPUT"

      - name: Create config/.pre.vars file
        env:
          S0_CONFIG_SECRETS_AUTH_ADMIN_PASSWORD: ${{ secrets.S0_CONFIG_SECRETS_AUTH_ADMIN_PASSWORD }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_OPENAI_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_OPENAI_API_KEY }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_ANTHROPIC_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_ANTHROPIC_API_KEY }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_XAI_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_XAI_API_KEY }}
          S0_CONFIG_SECRETS_AI_PROVIDERS_LITELLM_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_AI_PROVIDERS_LITELLM_API_KEY }}
          S0_CONFIG_SECRETS_MCPCF_ADMIN_API_TOKEN: ${{ secrets.S0_CONFIG_SECRETS_MCPCF_ADMIN_API_TOKEN }}
          MCPCF_PROXY_SIGNING_SECRET: ${{ secrets.MCPCF_PROXY_SIGNING_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          REPO_SECRETS_ENCRYPTION_KEY: ${{ secrets.REPO_SECRETS_ENCRYPTION_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          CF_AI_SEARCH_SERVICE_TOKEN_ID: ${{ secrets.CF_AI_SEARCH_SERVICE_TOKEN_ID }}
        run: |
          nub run config:write-stage-vars -- pre config/.pre.vars

      - name: Check current preview lifetime before deployment
        id: deploy-lifetime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-lifecycle.mjs deploy

      - name: Deploy preview
        id: deploy
        if: steps.deploy-lifetime.outputs.permitted == 'true'
        run: |
          ALCHEMY_STAGE="$PREVIEW_STAGE" nub run --cwd packages/infra deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AI_SEARCH_SERVICE_TOKEN_ID: ${{ secrets.CF_AI_SEARCH_SERVICE_TOKEN_ID }}
          WRANGLER_SEND_METRICS: "false"
          PREVIEW_STAGE: ${{ steps.deploy-lifetime.outputs.stage }}

      - name: Capture preview resource ownership
        id: preview-ownership
        if: steps.deploy.outcome == 'success'
        env:
          ALCHEMY_STAGE: ${{ steps.deploy-lifetime.outputs.stage }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$ALCHEMY_STAGE" != "pre" ]; then node scripts/preview-absence.mjs capture; fi

      - name: Preserve ephemeral preview ownership
        if: steps.preview-ownership.outcome == 'success' && steps.deploy-lifetime.outputs.stage != 'pre'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-ownership-${{ steps.deploy-lifetime.outputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e/preview-${{ steps.deploy-lifetime.outputs.stage }}-ownership.json
          retention-days: 90

      - name: Find existing comment
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outcome == 'success' }}
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- infra-preview -->"

      - name: Create or update PR comment
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outcome == 'success' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- infra-preview -->
            ## Preview Deployed
            Your preview is ready.
            **Preview URL:** ${{ steps.preview-target.outputs.website_url }}
            This preview was built from commit ${{ github.event.pull_request.head.sha }}
            ---
            <sub>This comment will be updated automatically when you push new commits to this PR.</sub>
          edit-mode: replace

  cleanup-preview:
    name: Clean up preview stage
    if: ${{ github.repository != 'SolZeroAI/platform' && ((github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy-ephemeral')) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: pre
    permissions:
      actions: read
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.4.11
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Create config/.pre.vars file
        env:
          S0_CONFIG_SECRETS_AUTH_ADMIN_PASSWORD: ${{ secrets.S0_CONFIG_SECRETS_AUTH_ADMIN_PASSWORD }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_OPENAI_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_OPENAI_API_KEY }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_ANTHROPIC_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_ANTHROPIC_API_KEY }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_XAI_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_XAI_API_KEY }}
          S0_CONFIG_SECRETS_AI_PROVIDERS_LITELLM_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_AI_PROVIDERS_LITELLM_API_KEY }}
          S0_CONFIG_SECRETS_MCPCF_ADMIN_API_TOKEN: ${{ secrets.S0_CONFIG_SECRETS_MCPCF_ADMIN_API_TOKEN }}
          MCPCF_PROXY_SIGNING_SECRET: ${{ secrets.MCPCF_PROXY_SIGNING_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          REPO_SECRETS_ENCRYPTION_KEY: ${{ secrets.REPO_SECRETS_ENCRYPTION_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          CF_AI_SEARCH_SERVICE_TOKEN_ID: ${{ secrets.CF_AI_SEARCH_SERVICE_TOKEN_ID }}
        run: |
          nub run config:write-stage-vars -- pre config/.pre.vars

      - name: Check current preview lifetime before cleanup
        id: cleanup-lifetime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-lifecycle.mjs cleanup

      - name: Restore verified preview ownership evidence
        if: steps.cleanup-lifetime.outputs.permitted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALCHEMY_STAGE: ${{ steps.cleanup-lifetime.outputs.stage }}
        run: node scripts/preview-ownership.mjs

      - name: Capture remaining preview resource ownership
        id: preview-ownership
        if: steps.cleanup-lifetime.outputs.permitted == 'true'
        env:
          ALCHEMY_STAGE: ${{ steps.cleanup-lifetime.outputs.stage }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/preview-absence.mjs capture

      - name: Clean up preview
        id: cleanup
        if: steps.cleanup-lifetime.outputs.permitted == 'true'
        run: ALCHEMY_STAGE="$PREVIEW_STAGE" nub run --cwd packages/infra destroy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AI_SEARCH_SERVICE_TOKEN_ID: ${{ secrets.CF_AI_SEARCH_SERVICE_TOKEN_ID }}
          WRANGLER_SEND_METRICS: "false"
          PREVIEW_STAGE: ${{ steps.cleanup-lifetime.outputs.stage }}

      - name: Verify all captured preview resources are absent
        id: cleanup-verified
        if: steps.cleanup.outcome == 'success'
        env:
          ALCHEMY_STAGE: ${{ steps.cleanup-lifetime.outputs.stage }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/preview-absence.mjs verify

      - name: Preserve preview cleanup evidence for retry
        if: always() && steps.preview-ownership.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-ownership-${{ steps.cleanup-lifetime.outputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .e2e/preview-${{ steps.cleanup-lifetime.outputs.stage }}-ownership.json
            .e2e/preview-cleanup-summary.json
          retention-days: 90

      - name: Find existing comment
        if: ${{ github.event_name == 'pull_request' }}
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- infra-preview -->"

      - name: Update comment with cleanup status
        if: steps.cleanup-verified.outcome == 'success' && steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: |
            <!-- infra-preview -->
            ## Preview Cleaned Up
            The preview for this PR has been cleaned up because the PR was closed.
            ---
            <sub>Preview resources have been removed from Cloudflare.</sub>
          edit-mode: replace
