name: Deploy Preview

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:
    inputs:
      stage:
        description: 'Preview stage to destroy (must start with "pre-")'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pre-{0}', github.event.pull_request.number) || github.event.inputs.stage || 'pre' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'closed') && github.event_name != 'workflow_dispatch' }}
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  deploy-preview:
    name: Deploy preview stage
    needs: validate
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pre
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Nub
        uses: nubjs/setup-nub@v0.4.0
        with:
          nub-version: 0.4.11
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Resolve preview target
        id: preview-target
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            stage="pre-${{ github.event.pull_request.number }}"
          else
            stage="pre"
          fi

          website_url=$(nub run config:stage-url -- "${stage}" | tail -n 1)

          echo "stage=${stage}" >> "$GITHUB_OUTPUT"
          echo "website_url=${website_url}" >> "$GITHUB_OUTPUT"

      - name: Create config/.pre.vars file
        env:
          S0_CONFIG_SECRETS_AUTH_ADMIN_PASSWORD: ${{ secrets.S0_CONFIG_SECRETS_AUTH_ADMIN_PASSWORD }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_OPENAI_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_OPENAI_API_KEY }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_ANTHROPIC_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_ANTHROPIC_API_KEY }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_XAI_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_XAI_API_KEY }}
          S0_CONFIG_SECRETS_AI_PROVIDERS_LITELLM_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_AI_PROVIDERS_LITELLM_API_KEY }}
          S0_CONFIG_SECRETS_MCPCF_ADMIN_API_TOKEN: ${{ secrets.S0_CONFIG_SECRETS_MCPCF_ADMIN_API_TOKEN }}
          MCPCF_PROXY_SIGNING_SECRET: ${{ secrets.MCPCF_PROXY_SIGNING_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          REPO_SECRETS_ENCRYPTION_KEY: ${{ secrets.REPO_SECRETS_ENCRYPTION_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          CF_AI_SEARCH_SERVICE_TOKEN_ID: ${{ secrets.CF_AI_SEARCH_SERVICE_TOKEN_ID }}
        run: |
          nub run config:write-stage-vars -- pre config/.pre.vars

      - name: Deploy preview
        run: |
          echo "Deploying preview stage ${{ steps.preview-target.outputs.stage }}"
          ALCHEMY_STAGE="${{ steps.preview-target.outputs.stage }}" nub run --cwd packages/infra deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AI_SEARCH_SERVICE_TOKEN_ID: ${{ secrets.CF_AI_SEARCH_SERVICE_TOKEN_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Find existing comment
        if: ${{ github.event_name == 'pull_request' }}
        id: find-comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- infra-preview -->"

      - name: Create or update PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- infra-preview -->
            ## Preview Deployed
            Your preview is ready.
            **Preview URL:** ${{ steps.preview-target.outputs.website_url }}
            This preview was built from commit ${{ github.event.pull_request.head.sha }}
            ---
            <sub>This comment will be updated automatically when you push new commits to this PR.</sub>
          edit-mode: replace

  cleanup-preview:
    name: Clean up preview stage
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.stage, 'pre-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pre
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Nub
        uses: nubjs/setup-nub@v0.4.0
        with:
          nub-version: 0.4.11
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Validate manual cleanup stage
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          stage="${{ github.event.inputs.stage }}"
          if [[ "$stage" != pre-* ]]; then
            echo "::error::stage input must start with 'pre-', got: $stage"
            exit 1
          fi
          echo "Validated stage: $stage"

      - name: Create config/.pre.vars file
        env:
          S0_CONFIG_SECRETS_AUTH_ADMIN_PASSWORD: ${{ secrets.S0_CONFIG_SECRETS_AUTH_ADMIN_PASSWORD }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_OPENAI_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_OPENAI_API_KEY }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_ANTHROPIC_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_ANTHROPIC_API_KEY }}
          S0_CONFIG_SECRETS_CF_AI_GATEWAY_XAI_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_CF_AI_GATEWAY_XAI_API_KEY }}
          S0_CONFIG_SECRETS_AI_PROVIDERS_LITELLM_API_KEY: ${{ secrets.S0_CONFIG_SECRETS_AI_PROVIDERS_LITELLM_API_KEY }}
          S0_CONFIG_SECRETS_MCPCF_ADMIN_API_TOKEN: ${{ secrets.S0_CONFIG_SECRETS_MCPCF_ADMIN_API_TOKEN }}
          MCPCF_PROXY_SIGNING_SECRET: ${{ secrets.MCPCF_PROXY_SIGNING_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          REPO_SECRETS_ENCRYPTION_KEY: ${{ secrets.REPO_SECRETS_ENCRYPTION_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          CF_AI_SEARCH_SERVICE_TOKEN_ID: ${{ secrets.CF_AI_SEARCH_SERVICE_TOKEN_ID }}
        run: |
          nub run config:write-stage-vars -- pre config/.pre.vars

      - name: Clean up preview
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STAGE="${{ github.event.inputs.stage }}"
            echo "Cleaning up preview stage ${STAGE} (manual dispatch)"
          else
            STAGE="pre-${{ github.event.pull_request.number }}"
            echo "Cleaning up preview for PR #${{ github.event.pull_request.number }}"
          fi
          ALCHEMY_STAGE="$STAGE" nub run --cwd packages/infra destroy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AI_SEARCH_SERVICE_TOKEN_ID: ${{ secrets.CF_AI_SEARCH_SERVICE_TOKEN_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Find existing comment
        if: ${{ github.event_name == 'pull_request' }}
        id: find-comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- infra-preview -->"

      - name: Update comment with cleanup status
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: |
            <!-- infra-preview -->
            ## Preview Cleaned Up
            The preview for this PR has been cleaned up because the PR was closed.
            ---
            <sub>Preview resources have been removed from Cloudflare.</sub>
          edit-mode: replace
