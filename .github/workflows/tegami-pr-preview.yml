name: Tegami PR Preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

# A new push cancels the preview of the commit it replaces.
concurrency:
  group: tegami-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.draft == false
    uses: SolZeroAI/.github/.github/workflows/tegami-pr-preview.yml@master
    with:
      runs-on: '"ubuntu-latest"'
      setup-commands: |
        # Skip apt when the image already has both packages.
        dpkg -s pkg-config liblzma-dev >/dev/null 2>&1 || {
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev
        }
