name: Validate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to validate"
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate:
    name: Repository validation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Nub
        uses: nubjs/setup-nub@v0.4.0
        with:
          nub-version: 0.4.11
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Validate configuration
        run: nub run config:check

      - name: Typecheck
        run: nub run typecheck

      - name: Lint
        run: nub run lint

      - name: Check formatting
        run: nub run format

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          filter_mode: nofilter

      - name: Collect end-to-end tests
        run: nub run test:e2e:list

      - name: Build
        if: github.repository != 'SolZeroAI/platform'
        run: nub run build

  e2e:
    name: Cloudflare end-to-end flows
    concurrency:
      group: solzero-e2e-cloudflare-${{ github.repository }}
      cancel-in-progress: false
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_AI_GATEWAY_E2E_TOKEN: ${{ secrets.CF_AI_GATEWAY_E2E_TOKEN }}
      CF_AI_GATEWAY_E2E_ID: default
      E2E_CONTAINER_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: nubjs/setup-nub@v0.4.0
        with:
          nub-version: 0.4.11
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock
      - name: Install dependencies
        id: e2e-dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev
          nub install --frozen-lockfile
      - name: Verify Docker for source-image harnesses
        run: docker info
      - name: Install browser
        run: nub run test:e2e:install
      - name: Generate isolated credentials
        shell: bash
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "E2E_USER_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Restore action replay cache
        uses: actions/cache/restore@v5
        with:
          path: .e2e/cache
          key: e2e-solzero-${{ runner.os }}-${{ hashFiles('nub.lock', 'e2e.config.ts', 'scripts/e2e/**', 'tests/**/*.e2e.ts') }}-${{ github.run_id }}
          restore-keys: |
            e2e-solzero-${{ runner.os }}-${{ hashFiles('nub.lock', 'e2e.config.ts', 'scripts/e2e/**', 'tests/**/*.e2e.ts') }}-
            e2e-solzero-${{ runner.os }}-
      - name: Run core real-stack flows
        run: nub run test
      - name: Destroy owned test infrastructure and revoke its run token
        if: always() && steps.e2e-dependencies.outcome == 'success'
        run: nub run test:e2e:cleanup
      - name: Preserve successful replay recordings
        if: always() && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: .e2e/cache
          key: e2e-solzero-${{ runner.os }}-${{ hashFiles('nub.lock', 'e2e.config.ts', 'scripts/e2e/**', 'tests/**/*.e2e.ts') }}-${{ github.run_id }}
      - name: Upload diagnostic reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: solzero-e2e
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/summary.md
            .e2e/failures
            .e2e/artifacts
          if-no-files-found: warn
          retention-days: 7
