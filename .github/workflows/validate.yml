name: Validate

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - master
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to validate"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      e2e_lifecycle:
        description: "Run real cleanup lifecycle regressions after core flows"
        type: boolean
        default: false
      e2e_record:
        description: "Record action replays and upload .e2e/cache instead of strict replay"
        type: boolean
        default: false
      e2e_commit:
        description: "Commit the e2e_record recordings to the dispatched branch"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# A new push to a pull request cancels the run on the commit it replaces. Pushes to master
# and dispatches each get their own group here; on master the jobs below cancel the older
# commit's checks. Groups name the calling workflow, so a Deploy Preview call never cancels
# a direct Validate run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Repository validation
    # A newer master commit holds every change in an older one, so it cancels the older
    # commit's validation.
    concurrency:
      group: ${{ github.event_name == 'push' && format('{0}-validate-master', github.workflow) || format('{0}-validate-{1}', github.workflow, github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.S0_CI_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    env:
      S0_CONFIG_PROFILE: ${{ vars.S0_CONFIG_PROFILE }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.ref }}

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.6
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Validate configuration
        run: nub run config:check

      - name: Check configuration CLI contracts
        run: nub run test:config

      - name: Typecheck
        run: nub run typecheck

      - name: Lint
        run: nub run lint

      - name: Check formatting
        run: nub run format

      # The local reporter prints findings and fails this step, so the
      # "Repository validation" check reports actionlint. The default
      # github-pr-check reporter creates a check run through the API. GitHub
      # adds that run to an older check suite on the same commit, so the pull
      # request never shows its status.
      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: local
          fail_level: error
          filter_mode: nofilter

      - name: Collect end-to-end tests
        run: nub run test:e2e:list

      - name: Build
        if: github.repository != 'SolZeroAI/platform'
        run: nub run build

  release-only:
    name: Detect release-only commit
    if: github.event_name == 'push'
    runs-on: ${{ vars.S0_CI_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.diff.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The Tegami version commit changes only VERSION, CHANGELOG.md and .tegami/. The pull
      # requests it releases already ran their tests. A newer master commit cancels an older
      # one's run, so compare with the last successful master run, not the parent commit.
      # Without a known base, the suite runs.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          base="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/runs?branch=master&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)"
          if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD; then
            changed="$(git diff --name-only "$base" HEAD)"
            others="$(printf '%s\n' "$changed" | grep -Ev '(^|/)(VERSION|CHANGELOG\.md)$|^\.tegami/' || true)"
            if [ -n "$changed" ] && [ -z "$others" ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  e2e:
    name: Cloudflare end-to-end flows
    needs: release-only
    # Each run boots its own local Alchemy stack and creates no remote resources. A newer push
    # to the same pull request, or a newer master commit, supersedes a run.
    concurrency:
      group: ${{ github.event_name == 'push' && format('{0}-e2e-master', github.workflow) || format('{0}-e2e-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    if: ${{ !cancelled() && needs.release-only.outputs.skip != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ${{ vars.S0_CI_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    # The github reporter edits one pull request comment. Artifact recovery reads Actions APIs.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_AI_GATEWAY_E2E_TOKEN: ${{ secrets.CF_AI_GATEWAY_E2E_TOKEN }}
      E2E_DECISION_MODEL: ${{ vars.E2E_DECISION_MODEL }}
      E2E_LANGUAGE_MODEL: ${{ vars.E2E_LANGUAGE_MODEL }}
      E2E_CONTAINER_RUNTIME: "1"
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.ref }}
          # The decision filter needs the base branch and the merge base.
          fetch-depth: 0
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.6
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock
      - name: Install dependencies
        id: e2e-dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev
          nub install --frozen-lockfile
      - name: Verify Docker for source-image harnesses
        run: docker info
      - name: Install browser
        run: nub run test:e2e:install
      - name: Generate isolated credentials
        shell: bash
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "E2E_USER_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Initialize AI usage accounting
        id: ai-usage-init
        env:
          E2E_ACTION_CACHE_RESTORED: ${{ hashFiles('.e2e/cache/**') != '' }}
        run: |
          E2E_AI_VALIDATED_SHA="$(git rev-parse HEAD)"
          export E2E_AI_VALIDATED_SHA
          echo "E2E_AI_VALIDATED_SHA=$E2E_AI_VALIDATED_SHA" >> "$GITHUB_ENV"
          node scripts/e2e/ai-report.mjs init
      - name: Run core real-stack flows
        id: e2e-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_RECORD: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_record }}
          # Pull requests run the tests the decision filter says the diff can affect.
          # Pushes and manual runs run every test.
          E2E_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        # Committed recordings replay strictly. A stale recording fails the run.
        run: |
          if [ "$E2E_RECORD" = "true" ]; then
            nub run test
          elif [ -n "$E2E_CHANGED_SINCE" ]; then
            nub run test:e2e:cache-strict --changed-since "$E2E_CHANGED_SINCE" --pass-with-no-tests
          else
            nub run test:e2e:cache-strict
          fi
      - name: Verify cleanup lifecycle after core flows
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nub run test:e2e:lifecycle
      - name: Destroy owned test infrastructure and revoke its run token
        if: always() && steps.e2e-dependencies.outcome == 'success'
        run: |
          cleanup_status=0
          nub run test:e2e:cleanup || cleanup_status=$?
          node <<'NODE'
          const fs = require("node:fs"); const path = ".e2e/cleanup-summary.json"; if (fs.existsSync(path)) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Owned test cleanup\n\n```json\n" + fs.readFileSync(path, "utf8") + "\n```\n")
          NODE
          exit "$cleanup_status"
      - name: Summarize measured AI usage
        if: always() && steps.ai-usage-init.outcome == 'success'
        id: ai-usage-summary
        run: node scripts/e2e/ai-report.mjs summarize
      - name: Upload recorded action replays
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_record && steps.e2e-run.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: solzero-e2e-replays-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostic reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: solzero-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/cleanup-proof/report.json
            .e2e/cleanup-proof/junit.xml
            .e2e/cleanup-proof/summary.md
            .e2e/cleanup-summary.json
            .e2e/summary.md
            .e2e/failures
            .e2e/artifacts
            .e2e/ai-usage/summary.json
            .e2e/ai-usage/summary.md
          if-no-files-found: warn
          retention-days: 7

  commit-replays:
    name: Commit recorded action replays
    needs: e2e
    # A dispatched e2e_record run commits its recordings to the branch it ran on.
    # The App token push starts pull request CI; a GITHUB_TOKEN push would not.
    if: github.event_name == 'workflow_dispatch' && inputs.e2e_record && inputs.e2e_commit && github.ref_name != github.event.repository.default_branch
    runs-on: ${{ vars.S0_CI_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Check out the recorded commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Download recorded action replays
        uses: actions/download-artifact@v8
        with:
          name: solzero-e2e-replays-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e/cache
      - name: Commit and push changed recordings
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add .e2e/cache
          if git diff --cached --quiet; then
            echo "The recordings did not change."
            exit 0
          fi
          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "Update e2e action replay recordings" -m "Recorded by Validate run ${GITHUB_RUN_ID}."
          # The push fails when the branch moved after the recorded commit.
          # Run e2e_record again on the new head.
          git push origin "HEAD:refs/heads/${BRANCH}"
