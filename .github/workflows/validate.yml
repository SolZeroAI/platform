name: Validate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to validate"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      e2e_lifecycle:
        description: "Run real cleanup lifecycle regressions after core flows"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  validate:
    name: Repository validation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.ref }}

      - name: Set up Nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.4.11
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Validate configuration
        run: nub run config:check

      - name: Typecheck
        run: nub run typecheck

      - name: Lint
        run: nub run lint

      - name: Check formatting
        run: nub run format

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32 # v1
        with:
          fail_level: error
          filter_mode: nofilter

      - name: Collect end-to-end tests
        run: nub run test:e2e:list

      - name: Build
        if: github.repository != 'SolZeroAI/platform'
        run: nub run build

  e2e:
    name: Cloudflare end-to-end flows
    concurrency:
      group: solzero-e2e-cloudflare-${{ github.repository }}
      cancel-in-progress: false
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_AI_GATEWAY_E2E_TOKEN: ${{ secrets.CF_AI_GATEWAY_E2E_TOKEN }}
      CF_AI_GATEWAY_E2E_ID: default
      E2E_CONTAINER_RUNTIME: "1"
      E2E_AI_USAGE: "1"
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.ref }}
      - uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.4.11
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock
      - name: Install dependencies
        id: e2e-dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev
          nub install --frozen-lockfile
      - name: Recover completed hosted ownership before allocations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nub exec tsx scripts/e2e/recover-hosted.ts
          node <<'NODE'
          const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Hosted ownership recovery\n\n```json\n" + fs.readFileSync(".e2e/hosted-recovery-summary.json", "utf8") + "\n```\n")
          NODE
      - name: Verify Docker for source-image harnesses
        run: docker info
      - name: Install browser
        run: nub run test:e2e:install
      - name: Generate isolated credentials
        shell: bash
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "E2E_USER_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Restore action replay cache
        id: action-replay-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .e2e/cache
          key: e2e-replay-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}:${{ hashFiles('nub.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e2e-replay-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}:${{ hashFiles('nub.lock') }}-
            e2e-replay-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}:
      - name: Initialize AI usage accounting
        id: ai-usage-init
        env:
          E2E_ACTION_CACHE_RESTORED: ${{ steps.action-replay-cache.outputs.cache-matched-key != '' }}
        run: |
          E2E_AI_VALIDATED_SHA="$(git rev-parse HEAD)"
          export E2E_AI_VALIDATED_SHA
          echo "E2E_AI_VALIDATED_SHA=$E2E_AI_VALIDATED_SHA" >> "$GITHUB_ENV"
          node scripts/e2e/ai-report.mjs init
      - name: Run core real-stack flows
        id: e2e-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nub run test
      - name: Verify cleanup lifecycle after core flows
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nub run test:e2e:lifecycle
      - name: Destroy owned test infrastructure and revoke its run token
        if: always() && steps.e2e-dependencies.outcome == 'success'
        run: |
          cleanup_status=0
          nub run test:e2e:cleanup || cleanup_status=$?
          node <<'NODE'
          const fs = require("node:fs"); const path = ".e2e/cleanup-summary.json"; if (fs.existsSync(path)) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Owned test cleanup\n\n```json\n" + fs.readFileSync(path, "utf8") + "\n```\n")
          NODE
          exit "$cleanup_status"
      - name: Summarize measured AI usage
        if: always() && steps.ai-usage-init.outcome == 'success'
        id: ai-usage-summary
        run: node scripts/e2e/ai-report.mjs summarize
      - name: Preserve successful replay recordings
        if: success() && steps.e2e-run.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .e2e/cache
          key: e2e-replay-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}:${{ hashFiles('nub.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve exact cleanup ownership for recovery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solzero-cleanup-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e/cleanup-ownership.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload diagnostic reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solzero-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/cleanup-proof/report.json
            .e2e/cleanup-proof/junit.xml
            .e2e/cleanup-proof/summary.md
            .e2e/cleanup-summary.json
            .e2e/hosted-recovery-summary.json
            .e2e/summary.md
            .e2e/failures
            .e2e/artifacts
            .e2e/ai-usage/summary.json
            .e2e/ai-usage/summary.md
          if-no-files-found: warn
          retention-days: 7
