name: Tegami PR Comment

on:
  workflow_run:
    workflows:
      - Tegami PR Preview
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    uses: SolZeroAI/.github/.github/workflows/tegami-pr-comment.yml@master
    with:
      runs-on: '"ubuntu-latest"'
      setup-commands: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev
