# Advanced CodeQL setup. Job names are the required check contexts.
# Keep the name values literal so they stay Analyze (javascript-typescript)
# and Analyze (actions). Disable code scanning default setup when this file
# is on master. Default setup has no merge_group trigger, and it rejects
# advanced setup uploads while it remains enabled.
name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:
    types: [checks_requested]
    branches:
      - master
  schedule:
    - cron: "32 8 * * 1"

permissions:
  contents: read

jobs:
  analyze-javascript-typescript:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions
