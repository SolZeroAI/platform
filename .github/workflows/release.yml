name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: Publish agent container images
    if: >-
      github.repository == 'SolZeroAI/platform' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/agent-container-images.yml
    cache-mode: read
    permissions:
      contents: read
      packages: write

  release:
    name: Version or release SolZero
    needs: images
    if: >-
      github.repository == 'SolZeroAI/platform' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    # The release environment is limited to master and holds the app id and private key.
    environment: release
    # Writes go through the release app token. This job's GITHUB_TOKEN stays read-only.
    permissions:
      contents: read
    outputs:
      published: ${{ steps.published.outputs.published }}
      tag: ${{ steps.published.outputs.tag }}
      sha: ${{ steps.published.outputs.sha }}
    steps:
      # The app opens tegami/version-packages, so pull_request workflows start.
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Credentials stay in the checkout so the v* tag push uses this token.
          token: ${{ steps.release-token.outputs.token }}

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.6
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Skip registry publish when the version tag exists
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version or publish release
        run: nub run tegami ci
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          S0_CREATIVE_RELEASE_ASSETS: "true"

  # The only job that requests id-token or uses environment alchemy-new.
  registry:
    name: Publish alchemy.new registry package
    needs:
      - images
      - release
    if: >-
      github.repository == 'SolZeroAI/platform' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.release.outputs.published == 'true' &&
      needs.images.result == 'success' &&
      needs.release.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    environment: alchemy-new
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.6
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev

      - name: Install, build, and prune production dependencies
        run: |
          nub install --frozen-lockfile
          nub run build
          nub prune --prod

      - name: Publish to alchemy.new
        uses: SolZeroAI/alchemy-new-publish-action@v1
        with:
          version: ${{ needs.release.outputs.tag }}
          exclude: |
            **/*.md
            **/*.map
            node_modules/**/*.ts
            node_modules/**/*.tsx
            node_modules/**/*.mts
            node_modules/**/*.cts
            node_modules/.store/drizzle-kit@*
            node_modules/.store/@electric-sql+*
            node_modules/.store/workerd@*/node_modules/workerd/bin/workerd
            node_modules/.store/esbuild@*/node_modules/esbuild/bin/esbuild
            apps/web/dist/client/images

  # Pack preview only. No environment and no id-token.
  registry-dry-run:
    name: Dry-run alchemy.new registry package
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.6
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config liblzma-dev

      - name: Install, build, and prune production dependencies
        run: |
          nub install --frozen-lockfile
          nub run build
          nub prune --prod

      - name: Dry-run publish to alchemy.new
        uses: SolZeroAI/alchemy-new-publish-action@v1
        with:
          version: 0.0.0-dry-run
          dry-run: true
          exclude: |
            **/*.md
            **/*.map
            node_modules/**/*.ts
            node_modules/**/*.tsx
            node_modules/**/*.mts
            node_modules/**/*.cts
            node_modules/.store/drizzle-kit@*
            node_modules/.store/@electric-sql+*
            node_modules/.store/workerd@*/node_modules/workerd/bin/workerd
            node_modules/.store/esbuild@*/node_modules/esbuild/bin/esbuild
            apps/web/dist/client/images
